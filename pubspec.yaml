name: itto
description: "Itto - Location-based connection app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
